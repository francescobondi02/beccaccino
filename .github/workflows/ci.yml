name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:build-metadata
      - run: npm run test:coverage
      - run: npm run build # no VITE_ vars needed: they are optional at build time (verified)
      - name: Verify ordinary builds contain no source maps
        shell: bash
        run: |
          if find dist -type f -name '*.map' -print -quit | grep --quiet .; then
            echo "::error::Secret-free builds must not publish source maps."
            exit 1
          fi
      # Playwright remains local because it needs the database and backend test environment.
