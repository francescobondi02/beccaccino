name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Jest instantiates PrismaClient from src/db.ts in globalTeardown (outside the
    # per-project setupFiles that normally supply the test DATABASE_URL), and the
    # unit project loads src/utils/jwt.ts — which throws at import if JWT_SECRET is
    # unset — before tests/setup.ts assigns it. Both must be present job-wide.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/becca_test
      JWT_SECRET: ci-test-secret

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          # The integration suite hardcodes the becca_test database; `prisma db
          # push` connects to it but does not create it, so the server must.
          POSTGRES_DB: becca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run test:unit

      - run: npm run pretest

      - run: npm run test:integration
