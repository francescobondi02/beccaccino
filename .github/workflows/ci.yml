name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Torch pulls a heavy dependency tree; a cold install must not hang the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,train,serve]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Wheel install smoke
        run: |
          rm -rf build
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/becca-wheel .
          python -m pip install --no-deps --target /tmp/becca-wheel-site /tmp/becca-wheel/becca_ai-*.whl
          cd /tmp
          PYTHONPATH=/tmp/becca-wheel-site python -c "import importlib.util; from pathlib import Path; import inference.pimc, serving.tiers; root = Path('/tmp/becca-wheel-site'); assert Path(inference.pimc.__file__).is_relative_to(root); assert Path(serving.tiers.__file__).is_relative_to(root); assert importlib.util.find_spec('serving.export_onnx') is None; assert importlib.util.find_spec('training.self_play_env') is None"

      - name: Fixture drift gate
        # The fixture is consumed byte-for-byte by the backend serializer test, so a
        # stale committed copy is a cross-language contract break. Regenerate and fail
        # if the working tree moved.
        run: |
          python -m scripts.gen_bot_fixtures
          git diff --exit-code serving/fixtures/
