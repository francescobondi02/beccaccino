name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_URL: https://beccaccino-client.vercel.app
      BACKEND_URL: https://beccaccino-server.onrender.com
      AI_URL: https://becca-ai.onrender.com
      VERCEL_PROJECT: beccaccino-client
      VERCEL_SCOPE: francesco-bondi-s-projects
    steps:
      - name: Require deployment configuration
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.7.0

      - name: Link Vercel project
        run: >-
          vercel link --yes
          --project="$VERCEL_PROJECT"
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull production environment
        run: >-
          vercel pull --yes
          --environment=production
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build exact commit
        run: >-
          vercel build --prod
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy exact build
        run: >-
          vercel deploy --prebuilt --prod
          --scope="$VERCEL_SCOPE"
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify deployed commit
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            metadata="$(curl --fail --silent --show-error \
              "$FRONTEND_URL/version.json?expected=$EXPECTED_SHA" 2>/dev/null || true)"
            deployed_sha="$(jq -r '.commit // empty' <<< "$metadata")"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report commit $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Verify production stack
        shell: bash
        run: |
          curl --fail --silent --show-error "$FRONTEND_URL/" \
            | grep --quiet '<div id="root"></div>'
          curl --fail --silent --show-error "$BACKEND_URL/ready" \
            | jq --exit-status '.status == "ready"' > /dev/null
          curl --fail --silent --show-error "$AI_URL/health" \
            | jq --exit-status \
              '.status == "ok" and .model == "ready" and .tier == "forte"' > /dev/null
