name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_URL: https://becca-ai.onrender.com
    steps:
      - name: Require deployment configuration
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger exact Render commit
        run: >-
          curl --fail --silent --show-error
          --get
          --data-urlencode "ref=$EXPECTED_SHA"
          "$DEPLOY_HOOK_URL"
          > /dev/null

      - name: Verify deployed commit
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            metadata="$(curl --fail --silent --show-error \
              "$PRODUCTION_URL/version?expected=$EXPECTED_SHA" 2>/dev/null || true)"
            deployed_sha="$(jq -r '.commit // empty' <<< "$metadata")"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report commit $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Verify model and tiers
        shell: bash
        run: |
          curl --fail --silent --show-error "$PRODUCTION_URL/health" \
            | jq --exit-status \
              '.status == "ok" and .model == "ready" and .tier == "forte"' > /dev/null
          curl --fail --silent --show-error "$PRODUCTION_URL/tiers" \
            | jq --exit-status \
              'map(.name) as $tiers
               | ($tiers | index("medio")) != null
               and ($tiers | index("forte")) != null
               and ($tiers | index("esperto")) != null' > /dev/null
