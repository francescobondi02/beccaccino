name: Align Expo SDK

# One-time job: installs Expo's recommended SDK patches from the public npm
# registry, which the development machine cannot reach. Remove after it runs.
on:
  push:
    branches:
      - feat/native-mobile-foundation
    paths:
      - .github/workflows/mobile-sdk-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
      - run: npm ci
      - run: npx expo install --fix
      - run: npm run check
      - run: npm run export
      - run: npm run check:sdk
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(mobile): align Expo SDK 58 patches" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          Copilot-Session: 44db590d-d8a3-4552-9fa6-8f5d6e2dba46"
          git push
