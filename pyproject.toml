[project]
name = "becca-ai"
version = "0.1.0"
description = "AI agent for Beccaccino card game — self-play RL training"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "tensorboard>=2.16",
    "wandb>=0.16",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.17",
    # Needed to EXPORT a checkpoint to ONNX (export_onnx.py), not just to serve.
    "torch>=2.2",
    "onnx>=1.16",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["becca_env*", "training*", "evaluation*", "serving*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
